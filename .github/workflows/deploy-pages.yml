name: Publicar GTA Manucho Online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio e inyectar configuración pública de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Falta el secret SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Falta el secret SUPABASE_ANON_KEY" && exit 1)
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='juego/supabase-config.local.js' \
            ./ _site/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path('_site/juego/supabase-config.local.js')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              "globalThis.GTA_MANUCHO_CONFIG = Object.freeze({\n"
              "  supabase: Object.freeze({\n"
              f"    url: {json.dumps(os.environ['SUPABASE_URL'])},\n"
              f"    anonKey: {json.dumps(os.environ['SUPABASE_ANON_KEY'])}\n"
              "  })\n"
              "});\n",
              encoding='utf-8'
          )
          PY

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

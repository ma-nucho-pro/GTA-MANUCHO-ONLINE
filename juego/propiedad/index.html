<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Propiedad · GTA MANUCHO</title>
  <script type="importmap">{"imports":{"three":"../bosque/libs/three.module.js"}}</script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;inset:0;pointer-events:none;z-index:10}#title{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(4,9,17,.88);border:1px solid #438cff;border-radius:10px;font-weight:1000;letter-spacing:.08em;text-align:center}#camera{position:absolute;top:68px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#bcd7ff;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:7px}
    #prompt{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);padding:10px 15px;background:rgba(4,9,17,.92);border:1px solid #438cff;border-radius:9px;font-weight:900;letter-spacing:.05em;display:none;text-align:center;max-width:92vw}
    #help{position:absolute;left:16px;bottom:16px;padding:10px 12px;background:rgba(4,9,17,.82);border:1px solid rgba(67,140,255,.65);border-radius:8px;font-size:11px;font-weight:800;line-height:1.55}
    #buttons{position:absolute;right:16px;top:16px;display:flex;gap:8px;pointer-events:auto}.btn{border:1px solid #438cff;background:rgba(4,9,17,.9);color:#fff;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.btn:hover{background:#16325a}
    #notice{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:12px 18px;background:rgba(4,9,17,.96);border:2px solid #438cff;border-radius:10px;font-weight:1000;letter-spacing:.05em;display:none;text-align:center}
    #loading{position:fixed;inset:0;z-index:30;background:#05080d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:1000;letter-spacing:.08em}.bar{width:min(420px,80vw);height:8px;background:#152238;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;width:25%;background:#438cff;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{width:100%}}
  </style>
</head>
<body>
  <div id="loading"><div>PREPARANDO PROPIEDAD</div><div class="bar"><span></span></div></div>
  <div id="hud">
    <div id="title">PROPIEDAD</div>
    <div id="camera">TERCERA PERSONA · V PARA CAMBIAR</div>
    <div id="buttons"><button class="btn" id="load">CARGAR PARTIDA</button><button class="btn" id="exit">SALIR A LA CIUDAD</button></div>
    <div id="notice"></div>
    <div id="prompt"></div>
    <div id="help">WASD · MOVERSE<br>SHIFT · CORRER<br>V · CÁMARA<br>E · INTERACTUAR<br>F9 · CARGAR ARCHIVO</div>
  </div>
  <input id="file" type="file" accept=".vcsave,.json,application/json" hidden>
  <script type="module" src="./game.js?v=70"></script>
</body>
</html>

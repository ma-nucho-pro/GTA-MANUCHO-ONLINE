<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Jugar Slow Roads</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1d3346, #06080d 62%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      padding: 34px 28px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: rgba(0,0,0,.38);
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 44px); }
    p { margin: 0 0 22px; line-height: 1.55; color: #dce8f0; }
    a.button {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      background: #ffffff;
      color: #08111b;
      text-decoration: none;
      font-weight: 700;
      transition: transform .18s ease, opacity .18s ease;
    }
    a.button:hover { transform: translateY(-2px); opacity: .92; }
    a.secondary { margin-left:10px; background:#263647; color:#fff; }
    .small { margin-top: 18px; font-size: 13px; opacity: .7; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Slow Roads</h1>
    <p>Este ordenador abre el juego oficial Slow Roads para conducir. Se necesita conexión a internet.</p>
    <a class="button" href="https://slowroads.io/" rel="noopener">ENTRAR A MANEJAR</a>
    <a class="button secondary" href="../../index.html?from=arcade">VOLVER AL SALÓN</a>
    <p class="small">El juego de conducción se abre desde su página oficial.</p>
  </main>
</body>
</html>

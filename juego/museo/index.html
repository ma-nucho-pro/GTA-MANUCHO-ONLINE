<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>GTA MANUCHO — Galería Three.js</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,Helvetica,sans-serif}canvas{display:block}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#06111c;z-index:20;transition:opacity .25s ease;pointer-events:none}#boot.hide{opacity:0}
    #bootCard{padding:24px 30px;border:1px solid #4bd9ff;border-radius:22px;background:rgba(9,23,34,.92);box-shadow:0 20px 60px #0008;text-align:center}#bootCard b{display:block;color:#59e2ff;font-size:28px;letter-spacing:4px;margin-bottom:8px}#bootCard span{color:#d9e6ee}
    #hud{position:fixed;left:22px;top:22px;z-index:5;min-width:370px;padding:18px 22px;border:2px solid #55def8;border-radius:22px;background:rgba(7,19,29,.88);box-shadow:0 16px 40px #0006;pointer-events:none}#title{font-weight:900;color:#62e4ff;font-size:28px;letter-spacing:5px}#mode{font-weight:900;color:#ffe04d;font-size:25px;margin:8px 0}#help{color:#e4edf5;font-size:17px;line-height:1.55}
    #status{position:fixed;right:22px;bottom:22px;z-index:5;padding:13px 18px;border:1px solid #74818a;border-radius:16px;background:rgba(10,17,23,.85);color:#e9f2f7;font-size:16px;pointer-events:none}
    #crosshair{display:none;position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);z-index:5;pointer-events:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}#crosshair:before{left:8px;top:0;width:2px;height:18px}#crosshair:after{left:0;top:8px;width:18px;height:2px}
    @media(max-width:700px){#hud{left:10px;top:10px;min-width:0;width:calc(100% - 20px);padding:12px 14px}#title{font-size:21px}#mode{font-size:19px}#help{font-size:14px}#status{right:10px;bottom:10px;font-size:13px}}
  </style>
  <script type="importmap">{"imports":{"three":"./libs/three/build/three.module.js","three/addons/":"./libs/three/examples/jsm/"}}</script>
</head>
<body>
  <div id="boot"><div id="bootCard"><b>GTA MANUCHO</b><span>Cargando Soldier y galería Three.js…</span></div></div>
  <div id="hud"><div id="title">GTA MANUCHO</div><div id="mode">TERCERA PERSONA</div><div id="help">WASD: caminar · Shift: correr · Espacio: saltar<br>V: cambiar cámara · Ratón: mirar · Rueda: zoom<br>Explora el museo · Para volver, cruza la puerta SALIDA A GTA MANUCHO</div></div>
  <div id="status">Cargando Soldier y galería…</div><div id="crosshair"></div>
  <script type="module" src="./game.js"></script>
</body>
</html>

    <script>
        window.__GTA_MANUCHO_OFFLINE__ = true;
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.unregister()));
        }
        if ("caches" in window) {
            caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
        }

        // Mueve el panel de configuración de vehículo/HUD al extremo izquierdo.
        (() => {
            const moveTuningPanel = () => {
                const nodes = Array.from(document.querySelectorAll('div'));
                for (const node of nodes) {
                    const content = (node.textContent || '').replace(/\s+/g, ' ').trim();
                    if (!content.includes('HUD') || !content.includes('Vehicle') || !content.includes('Paint Material')) continue;

                    let panel = node;
                    while (panel.parentElement && panel.parentElement !== document.body) {
                        const style = getComputedStyle(panel);
                        if (style.position === 'fixed') break;
                        panel = panel.parentElement;
                    }
                    if (getComputedStyle(panel).position !== 'fixed') continue;

                    panel.style.setProperty('left', '8px', 'important');
                    panel.style.setProperty('right', 'auto', 'important');
                    panel.style.setProperty('top', '320px', 'important');
                    panel.style.setProperty('max-height', 'calc(100vh - 100px)', 'important');
                    panel.style.setProperty('z-index', '120', 'important');
                    panel.dataset.gtaVentaraPanelLeft = 'true';
                    return;
                }
            };

            document.addEventListener('DOMContentLoaded', () => {
                moveTuningPanel();
                const observer = new MutationObserver(moveTuningPanel);
                observer.observe(document.body, { childList: true, subtree: true });
                window.setInterval(moveTuningPanel, 750);
            });
        })();
    </script>
